<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <h1>Job Application form</h1>
    <div class="container">
        <form>
            <label for="name">Full Name: </label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required/>
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required/>
            <label for="position">Position: </label>
            <select id="position">
                <option select> Select a position</option>
                <option value="full-stack-developer">Full-Stack-Developer</option>
                <option value="frontend-developer">Frontend-Developer</option>
                <option value="backend-developer">Backend-Developer</option>
                <option value="ui/ux-designer">UI/UX-Designer</option>
                <option value="manager">Manager</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input type="radio" id="full-time" name="availability"/>
                <label for="full-time">Full-Time</label>
                <input type="radio" id="part-time" name="availability"/>
                <label for="part-time">Part-Time</label>
            </fieldset>
            <label for="message">Why do you want this job?
            <textarea id="message" minlength="10" maxlength="500" placeholder="write your motivation here..."></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
